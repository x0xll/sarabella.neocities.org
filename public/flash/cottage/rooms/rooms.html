<html>
    <head>
        <title data-il8n="game_cottage">My Cottage</title>
        <link rel="icon" href="/images/favicons/favicon.ico">
        <link rel="stylesheet" href="/styles.css">
        <meta charset="UTF-8" />
        <script src="/ruffle/ruffle.js"></script>
        <style type="text/css">
            body {
                margin: 0;
            }
        </style>
    </head>

    <script src="/save.js"></script>
<script src="/language.js"></script>

    <body class="game" onload="loadLanguagePref(); setupUserDropdown()">
      
        <script src="/header.js"></script>

        <script>
          const searchQueryString = window.location.search;
          const urlParameters = new URLSearchParams(searchQueryString);
          roomID = urlParameters.get('roomId')
        </script>

        <div class="swf" dir="ltr" rbidi="on">
        </div>

        <div class="footer">
            <a href="/index.html" class="global-lowernav-link" data-il8n="footer_home_linktxt">Home</a> |
            <a href="https://bellasara.wiki.gg/wiki/My_Cottage" class="global-lowernav-link" data-il8n="footer_wiki_linktxt">Wiki Page</a>
        </div>

        <script src="/flags.js"></script>
<script src="/userManagerUpdatev2.js"></script>

        <script src="/flash/common/js/flashutils.js"></script>
        <script src="/flash/common/js/flashWSOverride.js"></script>

        <!-- Load correct localized version of the game -->
        <script>
          setupRuffle();
          var locale = checkLocalizedFiles(`../lang/cottage_${UTILS_LOCA_PATH_LANG_VALUE}.xml`);
          var swf = 'cottageentry.swf';
          
          switch(roomID)
          {
              default:
                roomID = 0;
              break;
              case "6":
                swf = 'cottagebedroom.swf';
              break;
              case "3":
                swf = 'livingroom.swf';
              break;
              case "16": 
                swf = 'rollandsgaardcastle.swf';
              break;
              case "15":
                swf = 'valerykcastle.swf';
              break;
              case "12":
                swf = 'shahazarcastle.swf';
              break;
              case "8":
                swf = "theatre.swf";
              break;
              case "9":
                swf = 'astronomy.swf';
              break;
              case "10":
                swf = 'bedroom2.swf';
              break;
              case "11":
                swf = 'patio.swf';
              break;
              case "14":
                swf = "airistos.swf";
              break;
              case "19":
                swf = "iceCastleInterior.swf";
              break;
              case "13":
                swf = "islandar.swf";
              break;
              case "18":
                swf = "snowfield.swf";
              break;
              /*
              case "15":
                swf = "???.swf";
              break;
              case "17":
                swf = "mirsule.swf";
              break;
              case "20":
                swf = "christmasTree.swf";
              break;
              */
          }
          isBazaar = false
          loadSWF(swf, '500', '887', locale, "debug=true")
        </script>
    </body>
</html>
