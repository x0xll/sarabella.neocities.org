    <body style="text-align: center;"  onload="loadLanguagePref(); setupUserDropdown(); updateHighscore('SaraBellaQuiz')"></body>>
        <script src="/header.js"></script>

        <div id="gameDiv" style="padding-top: 10px; padding-bottom: 10px;">
            <script type="text/javascript">
                let currentGameID = "SaraBellaQuiz";

                // Gets lang file
                loadLanguagePref(false); 
                lang = getCurrentLanguageCode()

                function urlExists(url)
                {
                    var http = new XMLHttpRequest();
                    http.open('HEAD', url, false);
                    http.send();
                    return http.status!=404;
                }

                let accurateTrad = loadData(DATA_TYPES.accurateTranslations);
                let langFile = (accurateTrad) ? `./lang/og/${lang}.json` : `./lang/improved/${lang}.json`
                if (!lang || !urlExists(langFile)) {
                    if ((!accurateTrad && !urlExists(`./lang/og/${lang}.json`)) || accurateTrad)
                    {
                        lang ='en'
                        langFile = `./lang/og/${lang}.json`
                    }
                    else
                    {
                        langFile = `./lang/og/${lang}.json`
                    }
                };
                let langData
                const xmlHttp = new XMLHttpRequest();
                xmlHttp.onload = function() {
                    const myObj = JSON.parse(this.responseText);
                    langData = myObj
                }
                xmlHttp.open("GET", langFile);
                xmlHttp.send();

                let config = {
                    parent: "gameDiv",
                    type: Phaser.CANVAS,
                    width: 950,
                    height: 630,
                    backgroundColor: '#51499d',
                    scene: [
                        Load,
                        Quiz
                    ]
                };

                const game = new Phaser.Game(config);
        
            </script>
        </div>
